name: Validar estrutura do projeto
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - run: python3 Tools/verificar_projeto.py
      - run: python3 Tools/verificar_organizacao.py

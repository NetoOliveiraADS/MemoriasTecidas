name: Validar estrutura do projeto
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - name: Preparar .NET para as regras independentes de Unity
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Validar tecelagem, dados e sintaxe C#
        run: dotnet run --project Tests/PrimeiroFio/PrimeiroFio.Tests.csproj --configuration Release -- .
